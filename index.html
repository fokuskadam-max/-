<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Той шақыртуы – v15 пакеттер ажыратылды</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#faf6ef;color:#2a2118;font:16px/1.5 system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
.c{background:#fff;border:1px solid #e6dccb;border-radius:14px;padding:14px;margin-bottom:14px}
h1{font-size:23px} h2{font-size:16px;margin:0 0 10px}
label.f{display:block;font-size:14px;color:#7a6a58;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #e6dccb;border-radius:10px;background:#faf6ef;font:inherit}
textarea{min-height:70px} .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;border:0;border-radius:12px;padding:13px;background:#b4530f;color:#fff;font-weight:700;width:100%;cursor:pointer;margin-top:8px}
button.g{background:#fff;color:#b4530f;border:2px solid #b4530f}
iframe{width:100%;height:620px;border:1px solid #e6dccb;border-radius:14px;background:#fff}
.n{font-size:13px;color:#7a6a58;margin-top:6px}
.linkbox{background:#faf6ef;border:1px dashed #b4530f;border-radius:10px;padding:10px;word-break:break-all;font-size:14px;margin-top:10px}
.ok{background:#e7f8ec;border:1px solid #a7e8b8;border-radius:12px;padding:12px;margin-top:10px}
.th img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid #4ade80;margin:2px}
.pk label{display:block;border:2px solid #e6dccb;border-radius:12px;padding:10px;cursor:pointer;margin-bottom:8px}
.pk input{display:none} .pk label:has(input:checked){border-color:#b4530f;background:#fff7ed}
.pk ul{margin:6px 0 0;padding-left:16px;color:#7a6a58;font-size:13px} .pk li.no{opacity:.45;text-decoration:line-through}
.musics label{display:flex;gap:8px;align-items:center;border:1px solid #e6dccb;border-radius:10px;padding:9px;cursor:pointer;margin-bottom:6px}
.musics label:has(input:checked){border-color:#b4530f;background:#fff7ed}
#viewer{position:fixed;inset:0;z-index:999;background:#fff;display:none}
#viewer iframe{width:100%;height:100%;border:0}
.locked{opacity:.4;pointer-events:none;filter:grayscale(1)} .lockNote{font-size:12px;color:#b4530f;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<div id="viewer"></div>
<div class="w" id="mainForm">
<h1>👑 Той шақыртуы — v15</h1>
<p class="n">Пакетті ауыстырсаңыз — қызметтер де ауысады.</p>

<div class="c"><h2>1. Пакет — таңдаңыз</h2>
<div class="pk">
<label><input type="radio" name="pk" value="std" onchange="onPkg()"> <b>Стандарт — 3000 тг</b><ul><li>✅ Фото 1</li><li>✅ Мәлімет, карта, таймер</li><li class="no">❌ Конверт, Музыка, Видео</li><li class="no">❌ Дресс-код, Галерея, Календар</li></ul></label>
<label><input type="radio" name="pk" value="prem" checked onchange="onPkg()"> <b>Премиум — 5000 тг ✅ ТАҢДАУЛЫ</b><ul><li>✅ Фото 3 + Галерея</li><li>✅ 💌 Конверт + 🎵 Музыка + 🎥 Видео</li><li>✅ 👔 Дресс-код</li><li class="no">❌ Календар, Қонақ саны (тек VIP)</li></ul></label>
<label><input type="radio" name="pk" value="vip" onchange="onPkg()"> <b>VIP Luxury — 10000 тг 👑</b><ul><li>✅ Фото 4 + Галерея + GOLD</li><li>✅ Барлығы (Конверт, Музыка, Видео, Дресс-код)</li><li>✅ 📅 Календар + 👥 Қонақ саны</li></ul></label>
</div>
<p class="n" id="pkgInfo">Қазір: <b>Премиум</b> — Конверт + Музыка + Видео бар.</p>
</div>

<div class="c"><h2>2. Той мәліметі</h2>
<label class="f">Аты</label><input type="text" id="name" value="Алихан, 3 жас">

<label class="f">WhatsApp</label><input type="tel" id="wa" placeholder="77012345678">
<div id="dressBlock"><label class="f">👔 Дресс-код (Премиум / VIP)</label><input type="text" id="dress" placeholder="Мысалы: Қара + алтын"></div>
<div id="videoBlock"><label class="f">🎥 Видео сілтемесі (Премиум / VIP)</label><input type="text" id="video" placeholder="https://youtube.com/watch?v=..."></div>
</div>

<div class="c" id="musicBlock"><h2>🎵 3. Қазақша әуен (Премиум / VIP)</h2>

<label><input type="radio" name="music" value="kyzuzatu"> 💖 Қыз ұзату</label>
<label><input type="radio" name="music" value="atameken"> 🇰🇿 Атамекен</label>

</div>

<input type="file" id="musicFile" accept="audio/*" onchange="onMusic(this)">
<p class="n" id="musicStatus">Ән таңдалмаған.</p>
<audio id="musicPrev" controls style="width:100%;display:none"></audio>
<label class="f">Немесе mp3 сілтемесі</label>
<input type="text" id="musicUrl" placeholder="https://files.catbox.moe/....mp3">
</div>

<div class="c"><h2>📷 4. Фото <span id="photoLimit" style="font-size:12px;color:#b4530f">(максимум 3)</span></h2>
<input type="file" id="ph" accept="image/*" multiple onchange="onPhoto(this)">
<div class="th" id="th"></div>
<p class="n" id="photoStatus">Фото таңдалмаған.</p>
<label class="f">Немесе фото сілтемесі</label>
<input type="text" id="photoUrl" placeholder="https://files.catbox.moe/....jpg">
</div>

<div class="c"><h2>5. Дайын</h2>
<button onclick="makeInvite()">👑 Шақыртуды жасау</button>
<p class="n" id="debug" style="color:red"></p>
<iframe id="pv" style="display:none;margin-top:12px"></iframe>
<div id="act" style="display:none">
<p class="n" id="note"></p>
<button class="g" onclick="sendOrder()">📲 WhatsApp-қа жіберу</button>
<div class="c" style="margin-top:12px"><b>💳 Төлем: <span id="amt"></span></b><br><button onclick="copyKaspi()">📋 Kaspi нөмірін көшіру</button><button class="g" onclick="askCode()">✅ Төледім, код сұрау</button></div>
<div id="cd"><label class="f">Код</label><input type="text" id="code" placeholder="Кодты жазыңыз"><button onclick="checkCode()">🔓 Кодты енгізу</button></div>
<div id="dw" style="display:none"><div class="ok">✅ Дайын!</div><button onclick="makeLink()">🔗 Сілтеме алу</button>
<div id="linkArea" style="display:none"><div class="linkbox" id="linkText"></div><button class="g" onclick="copyLink()">📋 Сілтемені көшіру</button></div></div>
</div>
</div>
</div>

<script>
var SELLER="77082418836";
var CODES=["001-GY5N","002-GCQV","003-KVFV","004-WTWG","005-47Y7"];
var PRICE={std:3000,prem:5000,vip:10000};
var MUSICS={toy:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3",dombra:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",kyzuzatu:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",atameken:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"};
var MUSIC_NAMES={toy:"Той жыры",dombra:"Домбыра күйі",kyzuzatu:"Қыз ұзату",atameken:"Атамекен"};
var photos=[], uploadedMusic="", uploadedMusicName="", unlocked=false, lastLink="";
function $(i){return document.getElementById(i)}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function getPkg(){var e=document.querySelector('input[name=pk]:checked');return e?e.value:"prem"}
function getMusic(){var e=document.querySelector('input[name=music]:checked');return e?e.value:"toy"}
// ПАКЕТ БОЙЫНША ҚЫЗМЕТТЕР — ОСЫ ЖЕРДЕ АЖЫРАТЫЛАДЫ
function pkgFeatures(p){
  if(p==="std") return {envelope:false, music:false, video:false, dress:false, calendar:false, rsvp:false, maxPhoto:1, gallery:false, tag:"СТАНДАРТ", gold:false};
  if(p==="vip") return {envelope:true, music:true, video:true, dress:true, calendar:true, rsvp:true, maxPhoto:4, gallery:true, tag:"👑 VIP LUXURY", gold:true};
  return {envelope:true, music:true, video:true, dress:true, calendar:false, rsvp:false, maxPhoto:3, gallery:true, tag:"✨ ПРЕМИУМ", gold:false};
}
function onPkg(){
  var p=getPkg(), f=pkgFeatures(p);
  // Формада да жасыру — Стандарт болса музыка/видео/дресс-код жабылады
  $("musicBlock").style.display = f.music ? "block" : "none";
  $("dressBlock").style.display = f.dress ? "block" : "none";
  $("videoBlock").style.display = f.video ? "block" : "none";
  $("photoLimit").textContent = "(максимум "+f.maxPhoto+")";
  $("pkgInfo").innerHTML = "Қазір: <b>"+f.tag+"</b> — " + (p==="std" ? "Конверт, Музыка, Видео ЖОҚ. Тек фото 1 + мәлімет." : p==="prem" ? "Конверт + Музыка + Видео + Фото 3 + Дресс-код бар." : "Барлығы + Календар + Қонақ саны + Фото 4 бар.");
  // Егер стандартқа ауысса — артық фотоларды кесу
  if(photos.length>f.maxPhoto){ photos=photos.slice(0,f.maxPhoto); $("th").innerHTML=""; photos.forEach(function(u){var t=new Image();t.src=u;$("th").appendChild(t)}); $("photoStatus").textContent="✅ Фото: "+photos.length+" дана (пакетке сай)"; }
}

function build(d){
  var f=pkgFeatures(d.pkg);
  var isStd=d.pkg==="std";
  // Музыка тек Премиум/VIP-те

  var wa="https://api.whatsapp.com/send?phone="+(d.wa||"").replace(/\D/g,"")+"&text="+encodeURIComponent("Сәлеметсіз бе! Тойға келемін ✅ ");
  var wa2="https://api.whatsapp.com/send?phone="+(d.wa||"").replace(/\D/g,"")+"&text="+encodeURIComponent("Сәлеметсіз бе! Тойға келе алмаймын 😔 ");
  var calUrl="";

    var start=(d.date||"").replace(/-/g,"")+"T"+(d.time||"18:00").replace(":","")+"00";
    var end=(d.date||"").replace(/-/g,"")+"T220000";
    calUrl="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(d.name+" - "+d.kind)+"&dates="+start+"/"+end+"&location="+encodeURIComponent(d.place||"");
  }
  var photoHtml=allPhotos.length?'<div style="padding:7px;background:linear-gradient(135deg,#f5d76e,#c9a227);border-radius:20px;margin:12px 0"><img src="'+esc(allPhotos[0])+'" style="width:100%;display:block;border-radius:14px;aspect-ratio:4/3;object-fit:cover"></div>':'<div style="background:#fee2e2;padding:14px;border-radius:12px;margin:12px 0;font-family:system-ui,sans-serif;font-size:14px">📷 Фото таңдалмаған</div>';
  // Галерея тек Премиум/VIP-те, Стандартта тек 1 фото
  var other = f.gallery ? allPhotos.slice(1).map(function(u){return '<img src="'+esc(u)+'" style="width:100%;border-radius:14px;margin:6px 0">'}).join("") : "";
  var musicHtml=hasMusic?'<audio id="mus" loop><source src="'+esc(musicUrl)+'"></audio><div style="font-size:12px;color:#888">🎵 '+esc(musicLabel)+'</div><button style="width:100%;padding:12px;border:1px solid #b4530f;background:#fff;color:#b4530f;border-radius:12px;font-weight:700;cursor:pointer;margin:8px 0" onclick="var a=document.getElementById(\'mus\');if(a.paused){a.play();this.textContent=\'🔊 Ойнап тұр — өшіру\'}else{a.pause();this.textContent=\'🎵 Қосу\'}">🎵 '+esc(musicLabel)+' — Қосу</button>':"";
  var videoHtml=hasVideo?'<a style="display:block;padding:14px;border-radius:14px;background:#fff;border:2px solid #b4530f;color:#b4530f;text-decoration:none;margin:10px 0;font-family:system-ui,sans-serif;font-weight:700" target="_blank" href="'+esc(d.video)+'">▶️ Видеоны көру</a>':"";
  var dressHtml=hasDress?'<div style="background:#fff0f3;border:1px solid #e6c84a;border-radius:12px;padding:10px;margin:12px 0;font-family:system-ui,sans-serif;font-size:14px">👔 <b>Дресс-код:</b> '+esc(d.dress)+'</div>':"";
  var calHtml=hasCal?'<a style="display:block;padding:14px;border-radius:14px;background:#fff;border:2px solid #b4530f;color:#b4530f;text-decoration:none;margin:10px 0;font-family:system-ui,sans-serif;font-weight:700" target="_blank" href="'+calUrl+'">📅 Календарға қосу (VIP)</a>':"";
  var rsvpHtml=hasRsvp?'<div style="background:#f0f7ff;border:1px solid #bcd3ff;border-radius:14px;padding:12px;margin:12px 0;font-family:system-ui,sans-serif"><b>👥 Сіз неше адаммен келесіз? (VIP)</b><div style="display:flex;gap:6px;margin-top:8px"><a style="flex:1;background:#fff;border:1px solid #bcd3ff;border-radius:10px;padding:10px 4px;text-decoration:none;color:#1a3a6a;font-size:13px;font-weight:600;text-align:center" target="_blank" href="'+wa+'">2 адам</a><a style="flex:1;background:#fff;border:1px solid #bcd3ff;border-radius:10px;padding:10px 4px;text-decoration:none;color:#1a3a6a;font-size:13px;font-weight:600;text-align:center" target="_blank" href="'+wa+'">1 адам</a><a style="flex:1;background:#fff;border:1px solid #bcd3ff;border-radius:10px;padding:10px 4px;text-decoration:none;color:#1a3a6a;font-size:13px;font-weight:600;text-align:center" target="_blank" href="'+wa2+'">Келе алмаймын</a></div></div>':"";
  var target=d.date?d.date+"T"+(d.time
