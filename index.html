<!DOCTYPE html>
<html lang="kk">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ойыншықтар</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;padding:15px;background:#f5f5f5}
h1{text-align:center}
.search{width:100%;padding:12px;font-size:18px;border-radius:10px;border:1px solid #ccc;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card b{font-size:16px}
.card p{color:#666;margin:5px 0}
.card button{background:#25D366;color:#fff;border:0;padding:10px;width:100%;border-radius:8px;font-size:16px}
.pages{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.pages button{padding:10px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:16px}
.pages button.active{background:#000;color:#fff}
</style>
</head>
<body>
<h1>🎁 Ойыншықтар</h1>
<input class="search" id="search" placeholder="Кодты жаз... мысалы: 060-UPDH" oninput="goPage(1)">
<div class="grid" id="grid"></div>
<div class="pages" id="pages"></div>

let page=1;
const PER=16;
function filtered(){
  const q=document.getElementById('search').value.trim().toUpperCase();
  if(!q) return CODES;
  return CODES.filter(c=>c.includes(q));
}
function goPage(p){ page=p; render(); }
function render(){
  const list=filtered();
  const total=Math.ceil(list.length/PER);
  if(page>total) page=total||1;
  const start=(page-1)*PER;
  const items=list.slice(start,start+PER);
  document.getElementById('grid').innerHTML=items.map(c=>`
    <div class="card"><b>🧸 Ойыншық</b><p>Код: ${c}</p><button onclick="alert('Код: ${c}')">Таңдау</button></div>
  `).join('') || '<p>Табылмады</p>';
  let btns='';
  for(let i=1;i<=total;i++){ btns+=`<button class="${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`; }
  document.getElementById('pages').innerHTML=btns;
}
render();
</script>
